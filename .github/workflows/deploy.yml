name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 固定到 commit SHA（v4 轻量标签）：可变的 tag 引用是供应链攻击面
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app / worker / tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 用全新的本地 D1 跑一遍迁移。
      # 历史上有一次迁移在任何新库上都会失败（duplicate column name），
      # 因为没有这一步，问题存在了很久都没被发现。
      - name: Verify migrations apply to a fresh database
        run: |
          set -euo pipefail
          for f in ./db/migrations/*.sql; do
            echo "▶ applying $f"
            npx wrangler d1 execute txt2img-db --local -y --file="$f"
          done

      - name: Build
        run: npm run build

      # 仅提示，不阻塞：残留项都在 next / postcss 这类构建期依赖上，
      # 本项目是 output: "export" 纯静态导出，Next 服务端不受影响（详见 README）。
      - name: Dependency audit (informational)
        run: npm audit --omit=dev || true

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 固定到 commit SHA（v4 轻量标签）：可变的 tag 引用是供应链攻击面
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Ensure Queue exists
        run: npx wrangler queues create txt2img-task-queue || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=cf-text-to-image --branch=master

      - name: Deploy Queue Consumer Worker
        run: npx wrangler deploy --config queue-worker/wrangler.toml

      # 部署后冒烟：这套架构最容易漏的一类故障，就是「CI 全绿但站点打不开」。
      # Pages 的环境变量不在仓库里，缺了部署本身不会报错，只有请求进来才会 500，
      # 所以这里直接打线上接口，把配置缺失挡在 CI 里。
      - name: Smoke test (production)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://img.chongya.ccwu.cc' }}
        run: |
          set -euo pipefail

          echo "▶ 站点可达性 + ACCESS_PASSWORD 是否注入"
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/me.json -w '%{http_code}' "$SITE_URL/api/auth/me" || echo 000)
            [ "$code" = "200" ] && break
            echo "  第 $i 次：HTTP $code，5s 后重试"
            sleep 5
          done
          cat /tmp/me.json; echo
          [ "$code" = "200" ] || { echo "✗ /api/auth/me 返回 $code"; exit 1; }
          grep -q '"passwordConfigured":true' /tmp/me.json \
            || { echo "✗ ACCESS_PASSWORD 未注入 Pages —— 站点无法登录"; exit 1; }

          echo "▶ 鉴权链路（错误密码期望 401；返回 500 说明 ACCESS_PASSWORD / SESSION_SECRET 缺失）"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"password":"smoke-test-deliberately-wrong-password"}' \
            "$SITE_URL/api/auth/login")
          cat /tmp/login.json; echo
          [ "$code" = "401" ] || { echo "✗ 期望 401，实际 $code"; exit 1; }

          echo "✓ 生产环境鉴权与配置注入正常"
