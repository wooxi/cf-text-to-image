name = "cf-text-to-image"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"

[[d1_databases]]
binding = "DB"
database_name = "txt2img-db"
database_id = "2d60db07-4ef5-4b7a-a0e1-25182556237f"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "txt2img-images"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "txt2img-task-queue"

[vars]
# JWT_SECRET / ENABLE_REGISTRATION 通过 `wrangler pages secret put` 管理，不写入仓库
ENABLE_REGISTRATION = "false"
